name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract changelog section
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Anchor on the exact "## <version>" header. A substring test would let
          # 0.1.0 match inside an unrelated header, and stopping on the next
          # "## " keeps one release's notes out of the next one's.
          awk -v ver="$VERSION" '
            $0 ~ "^## " ver "([ \t]|$)" { p = 1; next }
            /^## / { if (p) exit }
            p { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "No CHANGELOG section found for $VERSION" >&2
            exit 1
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md
